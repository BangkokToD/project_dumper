name: Build AppImage (light/dark)

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system deps (Qt/XCB/Wayland basics)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xfixes0 \
            libxcb-xinput0 \
            libxcb-xkb1 \
            libwayland-client0 \
            libwayland-cursor0 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6

      - name: Install project (dev)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run tests (no GUI)
        run: |
          pytest -q -m "not gui"

      - name: Download linuxdeploy + appimagetool
        run: |
          mkdir -p .ci/bin
          curl -L -o .ci/bin/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o .ci/bin/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x .ci/bin/linuxdeploy .ci/bin/appimagetool

      - name: Build AppImage (light/dark)
        env:
          LINUXDEPLOY: ${{ github.workspace }}/.ci/bin/linuxdeploy
          APPIMAGETOOL: ${{ github.workspace }}/.ci/bin/appimagetool
        run: |
          ./scripts/build_appimage.sh

      - name: Checksums
        run: |
          cd dist_appimage
          sha256sum *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts (push)
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ github.sha }}
          path: |
            dist_appimage/*.AppImage
            dist_appimage/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_appimage/*.AppImage
            dist_appimage/SHA256SUMS.txt
